<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mau TV</title>
    <meta name="theme-color" content="#09090b">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.webmanifest">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#09090b', /* Zinc 950 */
                        surface: '#18181b',    /* Zinc 900 */
                        border: '#27272a',     /* Zinc 800 */
                        muted: '#a1a1aa'       /* Zinc 400 */
                    }
                }
            }
        }
    </script>

    <!-- HLS.js para reproducir M3U8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Cast SDK -->
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

    <style>
        /* Estilos personalizados y scrollbars */
        body { background-color: #09090b; color: #fafafa; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        
        .glass-panel { background: rgba(24, 24, 27, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        
        .channel-card { transition: all 0.2s ease; border: 1px solid transparent; }
        .channel-card:hover { background: rgba(255, 255, 255, 0.03); }
        .channel-card.active { 
            background: rgba(255, 255, 255, 0.06); 
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        select option { background: #18181b; color: #fafafa; }
        
        /* Animaciones */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
        
        /* Toast */
        #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 60; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 14px 20px; border-radius: 12px; font-weight: 500; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); animation: fadeIn 0.3s ease-out; font-size: 0.875rem; border: 1px solid rgba(255,255,255,0.1); }
        .toast.error { background: #27272a; color: #f87171; border-color: #ef444430; }
        .toast.info { background: #27272a; color: #fafafa; }

        /* Estilo forzado para el botón nativo de Cast */
        google-cast-button {
            cursor: pointer;
            width: 100%;
            height: 100%;
            --connected-color: #3b82f6;
            --disconnected-color: white;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden selection:bg-white selection:text-black">

    <!-- Navbar -->
    <header class="glass-panel sticky top-0 z-50 px-4 py-3 lg:px-6 lg:py-4 flex items-center justify-between shrink-0 border-b-0 lg:border-b">
        <div class="flex items-center gap-3">
            <div class="bg-white text-black p-1.5 lg:p-2 rounded-lg"><i data-lucide="tv" class="w-5 h-5 lg:w-6 lg:h-6"></i></div>
            <h1 class="text-lg lg:text-xl font-bold tracking-tight">Mau <span class="bg-surface border border-white/10 text-white px-2 py-0.5 rounded text-sm lg:text-base ml-1">TV</span></h1>
        </div>
        
        <button onclick="toggleChannelList()" class="p-2 lg:px-4 lg:py-2 bg-surface hover:bg-white hover:text-black border border-border rounded-lg flex items-center gap-2 transition-all duration-200 group">
            <i data-lucide="layout-panel-left" class="w-5 h-5"></i>
            <span class="hidden lg:block text-sm font-medium" id="toggle-text">Ocultar Lista</span>
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col lg:flex-row overflow-y-auto lg:overflow-hidden relative">
        
        <!-- Loading Overlay -->
        <div id="loader" class="absolute inset-0 bg-background z-50 flex flex-col items-center justify-center">
            <i data-lucide="loader" class="w-10 h-10 lg:w-12 lg:h-12 text-white animate-spin mb-4"></i>
            <h2 class="text-lg lg:text-xl font-semibold tracking-tight" id="loader-text">Inicializando...</h2>
            <p class="text-muted mt-2 text-xs lg:text-sm text-center px-4">Conectando con la base de datos de canales</p>
        </div>

        <!-- Left Side: Player & Info -->
        <section id="main-player-section" class="w-full lg:w-7/12 xl:w-8/12 flex flex-col bg-background border-b lg:border-b-0 lg:border-r border-border lg:h-full lg:overflow-y-auto transition-all duration-300">
            
            <!-- CONTENEDOR DEL REPRODUCTOR (Maneja el FullScreen) -->
            <div id="player-container" class="sticky top-0 z-40 lg:relative w-full aspect-video bg-black shrink-0 group border-b border-white/5 lg:border-0 shadow-2xl lg:shadow-none flex items-center justify-center transition-all duration-300">
                <video id="video-player" class="w-full h-full absolute inset-0" controls crossorigin playsinline></video>
                
                <!-- Overlay: Indicador de Canal (Top Left) -->
                <div class="absolute top-4 left-4 bg-black/60 px-3 py-1.5 rounded-lg border border-white/10 text-white opacity-0 group-hover:opacity-100 transition-opacity z-50 backdrop-blur flex items-center gap-2 pointer-events-none">
                    <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                    <span id="overlay-channel-indicator" class="text-xs font-bold tracking-wider">-- / --</span>
                </div>

                <!-- Overlay: Herramientas (Top Right) -->
                <div class="absolute top-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity z-50">
                    <!-- Chromecast Button Wrapper -->
                    <div class="w-10 h-10 bg-black/60 rounded-lg flex items-center justify-center hover:bg-white/20 border border-white/10 transition-colors backdrop-blur">
                        <button is="google-cast-button" class="w-6 h-6"></button>
                    </div>
                    <!-- Fullscreen Button -->
                    <button onclick="toggleFullScreen()" class="w-10 h-10 bg-black/60 rounded-lg flex items-center justify-center hover:bg-white/20 border border-white/10 text-white transition-colors backdrop-blur">
                        <i data-lucide="maximize" class="w-5 h-5" id="fs-icon"></i>
                    </button>
                </div>

                <!-- Overlay: Flecha Izquierda (Anterior) -->
                <button onclick="playPrevious()" class="absolute left-2 lg:left-4 top-1/2 -translate-y-1/2 w-10 h-10 lg:w-14 lg:h-14 bg-black/50 rounded-full flex items-center justify-center hover:bg-white hover:text-black hover:scale-110 border border-white/10 text-white opacity-0 group-hover:opacity-100 transition-all duration-200 z-50 backdrop-blur shadow-xl">
                    <i data-lucide="chevron-left" class="w-6 h-6 lg:w-8 lg:h-8"></i>
                </button>

                <!-- Overlay: Flecha Derecha (Siguiente) -->
                <button onclick="playNext()" class="absolute right-2 lg:right-4 top-1/2 -translate-y-1/2 w-10 h-10 lg:w-14 lg:h-14 bg-black/50 rounded-full flex items-center justify-center hover:bg-white hover:text-black hover:scale-110 border border-white/10 text-white opacity-0 group-hover:opacity-100 transition-all duration-200 z-50 backdrop-blur shadow-xl">
                    <i data-lucide="chevron-right" class="w-6 h-6 lg:w-8 lg:h-8"></i>
                </button>
            </div>

            <!-- Info Panel (Modificado para quitar el espacio en blanco) -->
            <div class="p-5 lg:p-8 flex-1 custom-scrollbar">
                <div class="mb-5">
                    <div class="flex items-start justify-between gap-3">
                        <h2 id="info-title" class="text-2xl lg:text-4xl font-bold tracking-tight mb-3 truncate">Selecciona un canal</h2>
                        <button id="share-channel-btn" class="shrink-0 px-3 py-2 rounded-lg bg-surface border border-white/10 hover:bg-white hover:text-black transition-colors text-xs lg:text-sm font-semibold flex items-center gap-1.5">
                            <i data-lucide="share-2" class="w-4 h-4"></i> Compartir
                        </button>
                    </div>
                    <div class="flex items-center gap-2 lg:gap-3 flex-wrap">
                        <span id="info-category" class="px-2.5 py-1 rounded-md text-[10px] lg:text-xs font-semibold bg-surface border border-white/5 text-muted uppercase tracking-wider">Categoría</span>
                        <span id="info-country" class="text-xs lg:text-sm text-muted flex items-center gap-1.5"><i data-lucide="globe-2" class="w-3.5 h-3.5 lg:w-4 lg:h-4"></i> País</span>
                    </div>
                </div>

            </div>
        </section>

        <!-- Right Side: Channel List -->
        <section id="channel-list-section" class="w-full lg:w-5/12 xl:w-4/12 flex flex-col lg:h-full bg-background pb-10 lg:pb-0 transition-all duration-300">
            <!-- Filters -->
            <div class="p-4 border-b border-border glass-panel shrink-0 z-10 sticky top-0 lg:relative rounded-b-xl">
                <div class="relative mb-3">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted"></i>
                    <input type="text" id="searchInput" placeholder="Buscar canal..." class="w-full bg-surface border border-border rounded-lg pl-9 pr-3 py-2.5 text-sm focus:outline-none focus:border-muted transition-colors text-white placeholder-muted">
                </div>
                <div class="flex gap-2">
                    <select id="countryFilter" class="flex-1 bg-zinc-900/95 text-white border border-white/15 rounded-lg px-2 py-2 lg:px-3 text-xs lg:text-sm focus:outline-none focus:ring-2 focus:ring-white/20 appearance-none truncate cursor-pointer hover:bg-zinc-800 transition-colors shadow-inner">
                        <option value="all">Todos los países</option>
                    </select>
                    <select id="categoryFilter" class="flex-1 bg-zinc-900/95 text-white border border-white/15 rounded-lg px-2 py-2 lg:px-3 text-xs lg:text-sm focus:outline-none focus:ring-2 focus:ring-white/20 appearance-none truncate cursor-pointer hover:bg-zinc-800 transition-colors shadow-inner">
                        <option value="all">Categorías</option>
                    </select>
                </div>
                <div class="mt-2.5 text-[11px] text-muted text-right font-medium" id="channel-count">0 canales</div>
            </div>

            <div class="flex-1 flex flex-col gap-3 p-3 lg:overflow-hidden">
                <!-- List -->
                <div id="channel-list" class="h-[42vh] lg:h-[52%] lg:min-h-[260px] lg:max-h-[52%] lg:overflow-y-auto p-2.5 space-y-1 custom-scrollbar glass-panel rounded-xl border border-white/5">
                    <!-- Channels injected here -->
                </div>

                <!-- EPG -->
                <div id="epg-container" class="glass-panel p-4 rounded-xl hidden flex-1 min-h-[180px] overflow-y-auto border border-white/5">
                    <h3 class="text-xs lg:text-sm font-semibold text-white mb-4 flex items-center gap-2">
                        <i data-lucide="list-video" class="w-4 h-4 lg:w-5 lg:h-5"></i> Guía de Programación
                    </h3>
                    <div id="epg-content" class="text-sm text-muted">
                        <!-- Inyectado dinámicamente -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script>
        // --- ESTADO GLOBAL ---
        const state = {
            channels: [], 
            filtered: [], 
            currentIndex: -1,
            userCountry: 'ar',
            proxyUrl: 'https://tvip.papamasro.workers.dev/', 
            hls: null,
            categoriesMap: {}, 
            countriesMap: {}, 
            skipTimeout: null, 
            consecutiveErrors: 0, 
            epgCache: {},
            listVisible: true,
            selectedChannel: null
        };

        const DOM = {
            video: document.getElementById('video-player'),
            list: document.getElementById('channel-list'),
            search: document.getElementById('searchInput'),
            countryFilter: document.getElementById('countryFilter'),
            categoryFilter: document.getElementById('categoryFilter'),
            count: document.getElementById('channel-count'),
            loader: document.getElementById('loader'),
            loaderText: document.getElementById('loader-text')
        };

        // --- LÓGICA DE INTERFAZ Y PANTALLA COMPLETA ---
        function toggleChannelList() {
            state.listVisible = !state.listVisible;
            const leftPanel = document.getElementById('main-player-section');
            const rightPanel = document.getElementById('channel-list-section');
            const toggleText = document.getElementById('toggle-text');

            if (state.listVisible) {
                rightPanel.classList.remove('hidden');
                leftPanel.classList.remove('lg:w-full', 'xl:w-full');
                leftPanel.classList.add('lg:w-7/12', 'xl:w-8/12');
                if(toggleText) toggleText.innerText = "Ocultar Lista";
            } else {
                rightPanel.classList.add('hidden');
                leftPanel.classList.remove('lg:w-7/12', 'xl:w-8/12');
                leftPanel.classList.add('lg:w-full', 'xl:w-full');
                if(toggleText) toggleText.innerText = "Mostrar Lista";
            }
        }

        function updateChannelHash(channel) {
            if (!channel || !channel.id) return;
            const targetHash = `channel=${encodeURIComponent(channel.id)}`;
            if (window.location.hash.replace('#', '') !== targetHash) {
                history.replaceState(null, '', `#${targetHash}`);
            }
        }

        function getChannelIdFromHash() {
            const raw = window.location.hash.replace(/^#/, '');
            const params = new URLSearchParams(raw);
            return params.get('channel');
        }

        function shareCurrentChannel() {
            if (!state.selectedChannel) {
                showToast("Primero seleccioná un canal.", "info");
                return;
            }
            const shareUrl = `${window.location.origin}${window.location.pathname}#channel=${encodeURIComponent(state.selectedChannel.id)}`;
            const shareData = {
                title: `Mau TV - ${state.selectedChannel.name}`,
                text: `Mirá este canal en Mau TV: ${state.selectedChannel.name}`,
                url: shareUrl
            };

            if (navigator.share) {
                navigator.share(shareData).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(shareUrl)
                    .then(() => showToast("Link del canal copiado.", "info"))
                    .catch(() => showToast("No se pudo copiar el link.", "error"));
            } else {
                showToast(shareUrl, "info");
            }
        }

        async function toggleFullScreen() {
            const container = document.getElementById('player-container');
            const icon = document.getElementById('fs-icon');
            
            // Verificamos si estamos en "Pseudo-Fullscreen" usando clases de Tailwind
            const isPseudoFS = container.classList.contains('fixed');
            
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !isPseudoFS) {
                let success = false;
                
                // Intento 1: Fullscreen API Nativo
                try {
                    if (container.requestFullscreen) {
                        await container.requestFullscreen();
                        success = true;
                    } else if (container.webkitRequestFullscreen) { /* Safari */
                        container.webkitRequestFullscreen();
                        success = true;
                    }
                } catch (err) {
                    success = false;
                }
                
                // Intento 2: Pseudo-Fullscreen usando clases si el nativo falló
                if (!success) {
                    container.classList.remove('sticky', 'lg:relative', 'aspect-video', 'top-0', 'z-40');
                    container.classList.add('fixed', 'inset-0', 'z-[9999]', 'w-[100vw]', 'h-[100dvh]');
                }
                
                icon.setAttribute('data-lucide', 'minimize');
            } else {
                // Restaurar vista normal
                try {
                    if (document.fullscreenElement && document.exitFullscreen) {
                        await document.exitFullscreen();
                    } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                } catch (e) {}
                
                // Remover clases de Pseudo-Fullscreen (CSS fallback)
                container.classList.remove('fixed', 'inset-0', 'z-[9999]', 'w-[100vw]', 'h-[100dvh]');
                container.classList.add('sticky', 'lg:relative', 'aspect-video', 'top-0', 'z-40');
                icon.setAttribute('data-lucide', 'maximize');
            }
            lucide.createIcons({ root: container });
        }

        // Salir de CSS Pseudo-Fullscreen pulsando ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const container = document.getElementById('player-container');
                if (container && container.classList.contains('fixed')) {
                    toggleFullScreen();
                }
            }
        });

        function getProxyUrl(type, value) {
            try {
                let base = state.proxyUrl;
                if (!base.endsWith('/')) base += '/';
                const urlObj = new URL(base);
                urlObj.searchParams.set(type, value);
                return urlObj.toString();
            } catch (e) {
                return `${state.proxyUrl}?${type}=${encodeURIComponent(value)}`;
            }
        }

        // --- INICIALIZACIÓN ---
        async function init() {
            lucide.createIcons();
            try {
                updateLoader("Detectando ubicación...");
                await detectUserCountry();

                updateLoader("Descargando grilla de canales...");
                await fetchIPTVData();

                setupFilters();
                renderChannels();
                
                DOM.loader.classList.add('hidden');

                const channelFromHash = getChannelIdFromHash();
                const initialIndex = channelFromHash ? state.filtered.findIndex(c => c.id === channelFromHash) : -1;
                if(state.filtered.length > 0) {
                    playChannel(initialIndex >= 0 ? initialIndex : 0, false);
                }

                DOM.search.addEventListener('input', applyFilters);
                DOM.countryFilter.addEventListener('change', applyFilters);
                DOM.categoryFilter.addEventListener('change', applyFilters);
                const shareBtn = document.getElementById('share-channel-btn');
                if (shareBtn) {
                    shareBtn.addEventListener('click', shareCurrentChannel);
                }

                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
                }

            } catch (error) {
                console.error(error);
                updateLoader("Error al cargar datos. Verifica tu conexión.");
                showToast("Error crítico al iniciar la app.", "error");
            }
        }

        function updateLoader(text) {
            if(DOM.loaderText) DOM.loaderText.innerText = text;
        }

        async function detectUserCountry() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                if (data && data.country_code) {
                    state.userCountry = data.country_code.toLowerCase();
                }
            } catch (e) {
                state.userCountry = 'ar';
            }
        }

        async function fetchIPTVData() {
            const [streamsRes, channelsRes, categoriesRes, countriesRes] = await Promise.all([
                fetch('https://iptv-org.github.io/api/streams.json'),
                fetch('https://iptv-org.github.io/api/channels.json'),
                fetch('https://iptv-org.github.io/api/categories.json'),
                fetch('https://iptv-org.github.io/api/countries.json')
            ]);

            const streams = await streamsRes.json();
            const channels = await channelsRes.json();
            const categories = await categoriesRes.json();
            const countries = await countriesRes.json();

            categories.forEach(c => state.categoriesMap[c.id] = c.name);
            countries.forEach(c => state.countriesMap[c.code.toLowerCase()] = c.name);

            const streamMap = {};
            streams.forEach(s => {
                if (!streamMap[s.channel] && s.status !== 'error') {
                    streamMap[s.channel] = s.url;
                }
            });

            state.channels = channels
                .filter(c => streamMap[c.id])
                .map(c => ({
                    id: c.id,
                    name: c.name,
                    logo: c.logo || '',
                    country: c.country ? c.country.toLowerCase() : 'desconocido',
                    category: (c.categories && c.categories.length > 0) ? c.categories[0] : 'general',
                    url: streamMap[c.id]
                }));

            state.channels.sort((a, b) => a.name.localeCompare(b.name));
            state.filtered = [...state.channels];
        }

        function setupFilters() {
            const countries = [...new Set(state.channels.map(c => c.country).filter(Boolean))].sort((a, b) => {
                const nameA = state.countriesMap[a] || a;
                const nameB = state.countriesMap[b] || b;
                return nameA.localeCompare(nameB);
            });

            const cats = [...new Set(state.channels.map(c => c.category).filter(Boolean))].sort();

            countries.forEach(c => {
                if (c === 'desconocido') return;
                const opt = document.createElement('option');
                opt.value = c;
                opt.innerText = state.countriesMap[c] || c.toUpperCase();
                DOM.countryFilter.appendChild(opt);
            });

            cats.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.innerText = state.categoriesMap[c] || c.toUpperCase();
                DOM.categoryFilter.appendChild(opt);
            });

            if (countries.includes(state.userCountry)) {
                DOM.countryFilter.value = state.userCountry;
                applyFilters();
            }
        }

        function applyFilters() {
            const query = DOM.search.value.toLowerCase();
            const country = DOM.countryFilter.value;
            const category = DOM.categoryFilter.value;

            state.filtered = state.channels.filter(c => {
                const matchQ = c.name.toLowerCase().includes(query);
                const matchCountry = country === 'all' || c.country === country;
                const matchCat = category === 'all' || c.category === category;
                return matchQ && matchCountry && matchCat;
            });

            renderChannels();
        }

        // --- RENDERIZADO UX ---
        function renderChannels() {
            DOM.list.innerHTML = '';
            DOM.count.innerText = `${state.filtered.length} canales`;

            const indicator = document.getElementById('overlay-channel-indicator');
            if (indicator && state.currentIndex === -1) {
                indicator.innerText = `0 / ${state.filtered.length}`;
            }

            const limit = Math.min(state.filtered.length, 200);

            for (let i = 0; i < limit; i++) {
                const c = state.filtered[i];
                const div = document.createElement('div');
                const catName = state.categoriesMap[c.category] || c.category || 'General';
                const countryName = state.countriesMap[c.country] || c.country?.toUpperCase() || 'UNK';
                
                div.className = `channel-card p-2.5 rounded-xl cursor-pointer flex items-center gap-3.5 animate-fade`;
                div.style.animationDelay = `${i * 10}ms`;
                div.onclick = () => {
                    state.consecutiveErrors = 0; 
                    playChannel(i);
                    if(window.innerWidth < 1024) window.scrollTo({top: 0, behavior: 'smooth'});
                };

                div.innerHTML = `
                    <div class="w-10 h-10 lg:w-11 lg:h-11 rounded-lg bg-surface border border-white/10 flex items-center justify-center shrink-0 overflow-hidden">
                        ${c.logo ? `<img src="${c.logo}" class="w-full h-full object-contain" onerror="this.outerHTML='<i data-lucide=\\'tv\\' class=\\'w-5 h-5 text-muted\\'></i>'" loading="lazy">` : `<i data-lucide="tv" class="w-5 h-5 text-muted"></i>`}
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-semibold text-[13px] lg:text-sm truncate text-white">${c.name}</h4>
                        <div class="flex items-center gap-2 mt-1 text-[10px] lg:text-[11px] text-muted font-medium">
                            <span class="truncate max-w-[90px]">${countryName}</span>
                            <span class="w-1 h-1 rounded-full bg-white/20"></span>
                            <span class="truncate">${catName}</span>
                        </div>
                    </div>
                `;
                DOM.list.appendChild(div);
            }
            
            lucide.createIcons({ root: DOM.list });
        }

        function updateUISelection(index) {
            const cards = DOM.list.children;
            for(let i = 0; i < cards.length; i++) {
                cards[i].classList.remove('active');
            }
            if(cards[index]) {
                cards[index].classList.add('active');
                if(window.innerWidth >= 1024) {
                    cards[index].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        }

        // --- LÓGICA EPG (GUÍA) ---
        async function loadAndShowEPG(country, channelId, channelName) {
            const epgContainer = document.getElementById('epg-container');
            const epgContent = document.getElementById('epg-content');
            
            if (!country || country === 'desconocido') {
                epgContainer.classList.add('hidden');
                return;
            }

            epgContainer.classList.remove('hidden');
            epgContent.innerHTML = '<div class="flex items-center text-muted"><i data-lucide="loader-2" class="w-4 h-4 animate-spin mr-2"></i> Cargando guía...</div>';
            lucide.createIcons({ root: epgContainer });

            if (!state.epgCache[country]) {
                try {
                    const epgUrl = getProxyUrl('epg', country);
                    let res = await fetch(epgUrl);
                    
                    if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                    
                    const buffer = await res.arrayBuffer();
                    const view = new Uint8Array(buffer);
                    let text = "";

                    if (view.length > 2 && view[0] === 0x1F && view[1] === 0x8B) {
                        try {
                            const ds = new DecompressionStream('gzip');
                            const stream = new Response(buffer).body.pipeThrough(ds);
                            text = await new Response(stream).text();
                        } catch(e) {
                            text = new TextDecoder().decode(buffer);
                        }
                    } else {
                        text = new TextDecoder().decode(buffer);
                    }

                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(text, "text/xml");
                    
                    const channels = xmlDoc.getElementsByTagName('channel');
                    const programmes = xmlDoc.getElementsByTagName('programme');
                    
                    const programsMap = {}; 
                    const nameToIdMap = {}; 
                    
                    for(let i=0; i<channels.length; i++) {
                        const id = channels[i].getAttribute('id');
                        const displayNameNode = channels[i].getElementsByTagName('display-name')[0];
                        if(displayNameNode) {
                            nameToIdMap[displayNameNode.textContent.toLowerCase()] = id;
                        }
                    }

                    for(let i=0; i<programmes.length; i++) {
                        const p = programmes[i];
                        const channel = p.getAttribute('channel');
                        const start = parseXMLTVDate(p.getAttribute('start'));
                        const stop = parseXMLTVDate(p.getAttribute('stop'));
                        const titleNode = p.getElementsByTagName('title')[0];
                        const descNode = p.getElementsByTagName('desc')[0];
                        
                        if(!programsMap[channel]) programsMap[channel] = [];
                        
                        programsMap[channel].push({
                            start,
                            stop,
                            title: titleNode ? titleNode.textContent : 'Programa',
                            desc: descNode ? descNode.textContent : ''
                        });
                    }
                    
                    state.epgCache[country] = { programsMap, nameToIdMap };

                } catch (e) {
                    state.epgCache[country] = "error";
                }
            }

            const cache = state.epgCache[country];
            if (cache === "error") {
                epgContent.innerHTML = '<span class="text-red-400 text-xs">Guía no disponible temporalmente.</span>';
                return;
            }

            let targetId = null;
            if (cache.programsMap[channelId]) {
                targetId = channelId;
            } else if (cache.nameToIdMap[channelName.toLowerCase()]) {
                targetId = cache.nameToIdMap[channelName.toLowerCase()];
            } else {
                for (const [name, id] of Object.entries(cache.nameToIdMap)) {
                    if (name.includes(channelName.toLowerCase()) || channelName.toLowerCase().includes(name)) {
                        targetId = id;
                        break;
                    }
                }
            }

            if (!targetId || !cache.programsMap[targetId]) {
                epgContent.innerHTML = '<span class="text-muted italic text-xs">Sin información de programación para este canal.</span>';
                return;
            }

            const now = new Date();
            const programs = cache.programsMap[targetId];
            
            const currentProgram = programs.find(p => now >= p.start && now < p.stop);
            const currentIdx = programs.indexOf(currentProgram);
            const nextProgram = currentIdx !== -1 && currentIdx + 1 < programs.length ? programs[currentIdx + 1] : null;

            if (currentProgram) {
                let html = `
                    <div class="mb-3 p-4 bg-surface border border-white/5 rounded-xl relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1 h-full bg-white"></div>
                        <div class="flex items-center gap-2 mb-1.5">
                            <span class="bg-white text-black text-[9px] lg:text-[10px] font-bold px-1.5 py-0.5 rounded tracking-widest">AHORA</span>
                            <span class="text-muted text-[11px] lg:text-xs font-semibold">${formatTime(currentProgram.start)} - ${formatTime(currentProgram.stop)}</span>
                        </div>
                        <div class="text-white font-bold text-sm lg:text-base leading-tight">${currentProgram.title}</div>
                        ${currentProgram.desc ? `<div class="text-[12px] text-muted mt-1.5 line-clamp-2 leading-relaxed">${currentProgram.desc}</div>` : ''}
                    </div>
                `;
                
                if (nextProgram) {
                    html += `
                        <div class="p-3 bg-transparent border border-border rounded-xl flex items-center justify-between">
                            <div class="min-w-0 pr-4">
                                <div class="text-white font-medium text-xs lg:text-sm truncate">${nextProgram.title}</div>
                                <div class="text-muted text-[10px] lg:text-[11px] font-medium mt-0.5 tracking-wider">A CONTINUACIÓN</div>
                            </div>
                            <div class="text-muted text-xs font-semibold shrink-0 bg-surface px-2 py-1 rounded-md border border-white/5">
                                ${formatTime(nextProgram.start)}
                            </div>
                        </div>
                    `;
                }
                epgContent.innerHTML = html;
            } else {
                epgContent.innerHTML = '<span class="text-muted italic text-xs">No hay programas en emisión reportados.</span>';
            }
        }

        function parseXMLTVDate(str) {
            if (!str) return new Date();
            const year = str.substring(0,4);
            const month = str.substring(4,6) - 1;
            const day = str.substring(6,8);
            const hour = str.substring(8,10);
            const min = str.substring(10,12);
            const sec = str.substring(12,14);
            const offsetSign = str.substring(15,16) || '+';
            const offsetHours = str.substring(16,18) || '00';
            const offsetMins = str.substring(18,20) || '00';
            
            let date = new Date(Date.UTC(year, month, day, hour, min, sec));
            let offsetMs = (parseInt(offsetHours)*60*60*1000) + (parseInt(offsetMins)*60*1000);
            
            if (offsetSign === '+') date = new Date(date.getTime() - offsetMs); 
            else date = new Date(date.getTime() + offsetMs);
            
            return date;
        }

        function formatTime(date) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // --- REPRODUCTOR ---
        function playChannel(index, autoPlay = true) {
            if (index < 0 || index >= state.filtered.length) return;
            
            // Limpiar timeouts anteriores
            clearTimeout(state.skipTimeout);

            state.currentIndex = index;
            const channel = state.filtered[index];
            state.selectedChannel = channel;
            updateUISelection(index);
            updateChannelHash(channel);

            const indicator = document.getElementById('overlay-channel-indicator');
            if (indicator) {
                indicator.innerText = `${index + 1} / ${state.filtered.length}`;
            }

            // Actualizar panel de Info
            document.getElementById('info-title').innerText = channel.name;
            document.getElementById('info-category').innerText = state.categoriesMap[channel.category] || channel.category || 'General';
            
            const countryName = state.countriesMap[channel.country] || channel.country?.toUpperCase() || 'Desconocido';
            document.getElementById('info-country').innerHTML = `<i data-lucide="globe-2" class="w-3.5 h-3.5"></i> ${countryName}`;
            lucide.createIcons({ root: document.getElementById('info-country') });

            // EPG
            loadAndShowEPG(channel.country, channel.id, channel.name);

            // Iniciar HLS
            if (state.hls) {
                state.hls.destroy();
                state.hls = null;
            }

            if (Hls.isSupported()) {
                state.hls = new Hls({ 
                    maxMaxBufferLength: 30
                });
                
                // ✅ FIX: el manifest pasa por el worker, que reescribe todas las URLs
                // internas (segmentos, sub-playlists, keys) → ya no hace falta ProxyLoader
                state.hls.loadSource(getProxyUrl('url', channel.url));
                state.hls.attachMedia(DOM.video);
                
                state.hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    if(autoPlay) DOM.video.play().catch(e => console.warn("Autoplay bloqueado:", e));
                });

                state.hls.on(Hls.Events.FRAG_PLAYING, function() {
                    state.consecutiveErrors = 0;
                });

                state.hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                state.hls.destroy(); 
                                state.hls = null;
                                
                                state.consecutiveErrors++;
                                if (state.consecutiveErrors > 10) {
                                    showToast("Múltiples fallos seguidos. Selecciona manualmente.", "error");
                                    state.consecutiveErrors = 0; 
                                    return;
                                }

                                showToast(`${channel.name} no disponible. Saltando...`, "error");
                                state.skipTimeout = setTimeout(() => playNext(), 2000);
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                state.hls.recoverMediaError();
                                break;
                            default:
                                state.hls.destroy();
                                state.hls = null;
                                break;
                        }
                    }
                });

            } else if (DOM.video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari nativo
                const streamEndpoint = getProxyUrl('url', channel.url);
                DOM.video.src = streamEndpoint;
                if(autoPlay) DOM.video.play();
                
                DOM.video.onplaying = () => { 
                    state.consecutiveErrors = 0; 
                };
                DOM.video.onerror = () => {
                    state.consecutiveErrors++;
                    if (state.consecutiveErrors > 10) {
                        showToast("Múltiples fallos seguidos. Selecciona manualmente.", "error");
                        state.consecutiveErrors = 0;
                        return;
                    }
                    showToast(`${channel.name} no disponible. Saltando...`, "error");
                    clearTimeout(state.skipTimeout);
                    state.skipTimeout = setTimeout(() => playNext(), 2000);
                };
            }
        }

        function playNext() {
            if (state.currentIndex < state.filtered.length - 1) {
                playChannel(state.currentIndex + 1);
            } else {
                showToast("Fin de la lista.", "info");
            }
        }

        function playPrevious() {
            if (state.currentIndex > 0) {
                playChannel(state.currentIndex - 1);
            }
        }

        // --- COMPONENTES UI: TOASTS ---
        function showToast(message, type = "info") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = type === 'error' ? '<i data-lucide="triangle-alert" class="w-4 h-4"></i>' : '<i data-lucide="info" class="w-4 h-4"></i>';
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons({ root: toast });

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- INICIALIZADOR GOOGLE CAST ---
        window.__onGCastApiAvailable = function(isAvailable) {
            if (isAvailable) {
                cast.framework.CastContext.getInstance().setOptions({
                    receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
                    autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
                });
            }
        };

        // Boot
        window.addEventListener('DOMContentLoaded', init);

    </script>
